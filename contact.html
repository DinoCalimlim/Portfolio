<body>
  <header class="site-header">
    <nav class="navbar">

  <main>
    <section class="section contact" id="contact">
      <div class="section-header reveal">
        <h2>Contact</h2>
      </div>
      <div class="contact-grid">
        <div class="contact-copy reveal">
          <h3>Let me know</h3>
          <p>
            Feel free to send me a message if you are interested to interview me and work at your company anytime.
          </p>
          <div class="social-links">
            <a href="mailto:luiscalimlim082004@gmail.com" aria-label="Gmail">Gmail</a>
            <a href="https://github.com/DinoCalimlim" class="github" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" style="margin-right:8px;">
                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.016-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.744.083-.729.083-.729 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.809 1.304 3.495.997.108-.775.418-1.305.76-1.605-2.665-.305-5.467-1.332-5.467-5.931 0-1.31.469-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.3 1.23.958-.266 1.98-.399 3-.404 1.02.005 2.042.138 3 .404 2.29-1.552 3.295-1.23 3.295-1.23.655 1.653.243 2.874.12 3.176.77.84 1.235 1.91 1.235 3.221 0 4.61-2.807 5.624-5.48 5.921.43.372.815 1.102.815 2.222 0 1.606-.015 2.902-.015 3.293 0 .32.216.694.825.576C20.565 22.092 24 17.592 24 12.297 24 5.67 18.63.297 12 .297z"/>
              </svg>
              GitHub
            </a>
          </div>
        </div>
        <form class="contact-form reveal" id="contactForm">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your email" required />
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write a message" required></textarea>
          <button type="submit" class="btn btn-primary">Send Message</button>
          <p class="form-status" id="formStatus"></p>
        </form>
      </div>
    </section>

    <div id="reactRoot" data-page="contact"></div>
